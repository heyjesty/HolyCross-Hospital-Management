<header class="page-header">
  <div class="container">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'index' %}">Home</a></li>
        {% if parent_label %}<li class="breadcrumb-item"><a href="{{ parent_url }}">{{ parent_label }}</a></li>{% endif %}
        <li class="breadcrumb-item active" aria-current="page">{{ crumb|default:heading }}</li>
      </ol>
    </nav>
    <h1>{{ heading }}</h1>
    {% if subheading %}<p>{{ subheading }}</p>{% endif %}
  </div>
</header>
