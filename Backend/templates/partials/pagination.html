{% if page.has_other_pages %}
<nav class="d-flex justify-content-between align-items-center px-4 py-3 border-top" aria-label="Pagination">
  <span class="small text-muted">Showing {{ page.start_index }}–{{ page.end_index }} of {{ page.paginator.count }}</span>
  <ul class="pagination pagination-sm mb-0">
    {% if page.has_previous %}<li class="page-item"><a class="page-link" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.previous_page_number }}">&lsaquo;</a></li>{% endif %}
    <li class="page-item active"><span class="page-link">{{ page.number }} / {{ page.paginator.num_pages }}</span></li>
    {% if page.has_next %}<li class="page-item"><a class="page-link" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.next_page_number }}">&rsaquo;</a></li>{% endif %}
  </ul>
</nav>
{% endif %}
